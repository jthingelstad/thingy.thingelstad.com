<!-- public/ is copied raw (no Vite CSS), so the NotFound board's styles
     live inline. Same tokens as thingy-base.css; no sites strip here. Inter
     comes from the shared type (/shared/tokens.css); Archivo, Thingy's
     display costume, is declared here as it is in thingy-base.css. -->
<style>
@font-face { font-family: Archivo; font-style: normal; font-display: swap; font-weight: 100 900; font-stretch: 62% 125%;
  src: url('/fonts/archivo-latin-wdth-normal.woff2') format('woff2-variations');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: Archivo; font-style: normal; font-display: swap; font-weight: 100 900; font-stretch: 62% 125%;
  src: url('/fonts/archivo-latin-ext-wdth-normal.woff2') format('woff2-variations');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
:root { color-scheme: light dark;
  --thingy-cream: #f6eedc; --thingy-paper: #fffaf0; --thingy-toy-cream: #efe3c8;
  --thingy-ink: #1f2a38; --thingy-body: #3d4654; --thingy-clay: #b5461a; --thingy-clay-deep: #8a3410;
  --thingy-brass: #c7a04e; --thingy-screen: #17191b; --thingy-bezel: #ebddbd;
  --thingy-mint: #b9f0b1; --thingy-oops: #ffb98f; --thingy-focus: #1f6fd6;
  --thingy-edge: var(--thingy-ink); --thingy-navy: #1f2a38; --thingy-meta: #3d526b; --thingy-rule: #c9b994; --thingy-rule-mid: #e4d6b6; }
/* Dark by the system setting, the values in thingy-base.css. */
@media (prefers-color-scheme: dark) {
  :root { --thingy-cream: #1c1914; --thingy-paper: #26221b; --thingy-toy-cream: #322c23;
    --thingy-ink: #f6eedc; --thingy-body: #ddd4c2; --thingy-clay: #f3a274; --thingy-clay-deep: #f9c3a0;
    --thingy-focus: #8fb8f5; --thingy-edge: #8c7f68; --thingy-meta: #b6c0cd; --thingy-rule: #75684f; --thingy-rule-mid: #3f382c; }
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; overflow-x: clip;
  background: var(--thingy-cream); color: var(--thingy-ink);
  font-family: var(--jt-font-body, 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif);
  line-height: var(--jt-line-height, 1.6); }
a { color: var(--thingy-clay); font-weight: 700; }
a:hover { color: var(--thingy-clay-deep); }
a:focus-visible { outline: 3px solid var(--thingy-focus); outline-offset: 3px; }
.nf-header, .nf-main { width: 100%; max-width: var(--jt-frame, 70rem); margin: 0 auto; padding-inline: var(--jt-gutter, 1.5rem); }
.nf-header { padding-block: 24px; }
.nf-home { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; color: var(--thingy-ink); text-decoration: none; }
.nf-home:hover { color: var(--thingy-clay); }
.nf-wordmark { font-family: 'Archivo', 'Inter', sans-serif; font-weight: 800; font-stretch: 112%; font-size: 27px; letter-spacing: -0.01em; }
.thingy-face-animated .thingy-face-blink { transform-box: fill-box; transform-origin: center; animation: thingy-face-blink 4.5s infinite; }
@keyframes thingy-face-blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.15); } }
.nf-main { flex-grow: 1; padding-bottom: 40px; display: grid; gap: 48px; align-items: center;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); }
/* The illustration: the board's 500x640 box, kept whole at any width by
   percentages and container units. */
.nf-art { position: relative; width: 100%; max-width: 500px; aspect-ratio: 500 / 640; margin: 0 auto; container-type: inline-size; }
.nf-art > * { position: absolute; }
.nf-mascot { left: 26%; top: 0; width: 48%; height: auto; }
.nf-cabinet { left: 8%; top: 29.06%; width: 84%; height: 40.63%; padding: 3.6cqw; display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.4cqw; background: var(--thingy-toy-cream);
  border: 2px solid var(--thingy-edge); border-radius: 18px; box-shadow: 0 6px 0 var(--thingy-edge); }
.nf-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4cqw;
  background: var(--thingy-paper); border: 2px solid var(--thingy-edge); border-radius: 8px; }
.nf-cell.is-empty { background: var(--thingy-navy); box-shadow: inset 0 10px 0 #10171f; }
.nf-label { width: 11.6cqw; height: 4.4cqw; display: flex; flex-direction: column; justify-content: center; gap: 0.6cqw;
  padding: 0 1.6cqw; border: 2px solid var(--thingy-brass); border-radius: 3px; }
.nf-label i { display: block; height: 2px; background: var(--thingy-rule); }
.nf-pull { width: 5.2cqw; height: 1.8cqw; border: 2.5px solid var(--thingy-edge); border-top: 0; border-radius: 0 0 14px 14px; background: var(--thingy-brass); }
.nf-drawer { left: 33%; top: 56.56%; width: 34%; display: flex; flex-direction: column; }
.nf-drawer svg { display: block; width: 100%; height: auto; margin-bottom: -4px; }
.nf-drawer-front { aspect-ratio: 170 / 112; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4cqw;
  background: var(--thingy-paper); border: 2px solid var(--thingy-edge); border-radius: 10px; box-shadow: 0 6px 0 var(--thingy-edge); }
.nf-404 { min-width: 20.8cqw; padding: 0.8cqw 2.4cqw; text-align: center; background: var(--thingy-paper);
  border: 3px solid var(--thingy-brass); border-radius: 4px; box-shadow: inset 0 0 0 2px var(--thingy-paper), inset 0 0 0 3px var(--thingy-rule-mid);
  font-family: 'Archivo', 'Inter', sans-serif; font-weight: 800; font-stretch: 112%; font-size: 6.8cqw; line-height: 1.1; letter-spacing: -0.02em; }
.nf-drawer-front .nf-pull { width: 7.6cqw; height: 2.6cqw; border-width: 3px; }
.nf-shelf { left: 0; right: 0; top: 93.75%; margin: 0; text-align: center;
  font-size: var(--jt-size-label, 14px); font-weight: 600; letter-spacing: var(--jt-tracking-label, 0.06em); text-transform: uppercase; color: var(--thingy-meta); }
.nf-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; max-width: 520px; }
.nf-oops { display: block; filter: drop-shadow(0 6px 0 var(--thingy-edge)); }
h1 { margin: 0; font-family: 'Archivo', 'Inter', sans-serif; font-weight: 800; font-stretch: 112%;
  font-size: clamp(40px, 6vw, 64px); line-height: 0.98; letter-spacing: -0.025em; }
p { margin: 0; font-size: 22px; line-height: 1.55; color: var(--thingy-body); }
.nf-copy a { display: inline-block; min-height: 44px; line-height: 44px; margin-block: -10px; }
@media (width <= 40rem) {
  .nf-header { padding-block: 14px; }
  .nf-main { gap: 28px; }
  .nf-copy { gap: 18px; }
  p { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .thingy-face-animated .thingy-face-blink { animation: none; }
}
</style>
