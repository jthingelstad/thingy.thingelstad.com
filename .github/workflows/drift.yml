# Scheduled drift checks - external-state comparisons that should alert but
# never block a deploy: the vendored Librarian contract vs upstream main, and
# npm advisories. A failure opens (or comments on) a "Drift check failing"
# issue so it surfaces in Jamie's notifications instead of dying as a red
# scheduled run nobody is watching. The next passing run closes it.
name: Drift checks

# The failure step below files an issue; the repo's default workflow
# token is read-only, so grant issues:write explicitly.
permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: "web/.node-version"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Vendored contract matches librarian-thing main
        run: npm run contract:check

      - name: npm advisories
        run: npm audit --audit-level=high

      - name: Open or update the drift issue on failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search 'Drift check failing in:title' --json number --jq '.[0].number')
          body="Scheduled drift check failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Either the vendored Librarian contract no longer matches librarian-thing main, or npm advisories fired."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Drift check failing" --body "$body"
          fi

      - name: Close the drift issue once the check passes again
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for number in $(gh issue list --state open --search 'Drift check failing in:title' --json number,title --jq '.[] | select(.title == "Drift check failing") | .number'); do
            gh issue close "$number" --comment "Drift check passing again (run $run_url)"
          done
