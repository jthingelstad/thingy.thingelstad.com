# Scheduled drift checks - external-state comparisons that should alert but
# never block a deploy: the vendored Librarian contract and MCP surface vs
# upstream main, and npm advisories. A failure opens (or comments on) a
# "Drift check failing" issue so it surfaces in Jamie's notifications instead
# of dying as a red scheduled run nobody is watching. The next passing run
# closes it.
name: Drift checks

# The failure step below files an issue; the repo's default workflow
# token is read-only, so grant issues:write explicitly.
permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: "web/.node-version"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Vendored contract matches librarian-thing main
        run: npm run contract:check

      - name: Vendored MCP surface matches librarian-thing main
        run: npm run mcp-surface:check

      # Every high or critical advisory fails, except UNFIXABLE: braces
      # <=3.0.3 (GHSA-vfj7-8cjw-p6xm, 2026-09-18) has no patched release,
      # and stylelint reaches it through globby, fast-glob and micromatch to
      # glob our own CSS. Failing on it turned this check red every day with
      # nothing to fix, which would hide real contract drift. It is still
      # listed in the log; drop it here once braces ships a fix.
      - name: npm advisories
        env:
          UNFIXABLE: GHSA-vfj7-8cjw-p6xm
        run: |
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          jq -r '[.vulnerabilities[].via[] | objects
                  | select(.severity == "high" or .severity == "critical")]
                 | unique_by(.url)[] | "\(.severity) \(.name) \(.url)"' \
            "$RUNNER_TEMP/audit.json" > "$RUNNER_TEMP/advisories.txt"
          echo "High and critical advisories:"
          cat "$RUNNER_TEMP/advisories.txt"
          if grep -v "/advisories/${UNFIXABLE}$" "$RUNNER_TEMP/advisories.txt"; then
            echo "::error::npm advisories beyond ${UNFIXABLE} (listed above)"
            exit 1
          fi

      - name: Open or update the drift issue on failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search 'Drift check failing in:title' --json number --jq '.[0].number')
          body="Scheduled drift check failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Either the vendored Librarian contract or MCP surface no longer matches librarian-thing main, or npm advisories fired."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Drift check failing" --body "$body"
          fi

      - name: Close the drift issue once the check passes again
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for number in $(gh issue list --state open --search 'Drift check failing in:title' --json number,title --jq '.[] | select(.title == "Drift check failing") | .number'); do
            gh issue close "$number" --comment "Drift check passing again (run $run_url)"
          done
