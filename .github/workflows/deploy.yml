name: Build and Deploy (web)

# Standalone Thingy site (web/) → S3 + CloudFront (thingy-web stack).
# GitHub Pages retired 2026-09-01.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "thingy-web-production"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: "web/.node-version"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # npm audit and the upstream-contract fetch moved to drift.yml: both
      # depend on external state (advisory feed, librarian-thing main) and
      # were turning unrelated pushes red / blocking deploys on outages.
      # contract:generate:check proves the vendored artifact and the
      # generated client agree without touching the network.

      - run: npx playwright install --with-deps chromium webkit

      - run: npm run contract:generate:check

      - run: npm run format:check

      - run: npm run lint

      - run: npm run lint:css

      - run: npm run typecheck

      - run: npm run knip

      - run: npm run test:coverage

      - run: npm run test:components

      - run: npm run build
        env:
          LIBRARIAN_API_URL: ${{ vars.LIBRARIAN_API_URL }}
          LIBRARIAN_STREAM_URL: ${{ vars.LIBRARIAN_STREAM_URL }}
          TINYLYTICS_SITE_UID: ${{ vars.TINYLYTICS_SITE_UID }}

      - name: Browser smoke
        env:
          LIBRARIAN_API_URL: ${{ vars.LIBRARIAN_API_URL }}
          LIBRARIAN_STREAM_URL: ${{ vars.LIBRARIAN_STREAM_URL }}
          TINYLYTICS_SITE_UID: ${{ vars.TINYLYTICS_SITE_UID }}
        run: |
          npx vite preview --host 0.0.0.0 --port=8080 > /tmp/thingy-vite-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..30}; do
            if curl -fsS http://localhost:8080/chat/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/chat/ > /dev/null
          THINGY_SMOKE_URL=http://localhost:8080 npm run smoke

      - uses: actions/upload-artifact@v6
        with:
          name: web-site
          path: web/_site
          include-hidden-files: true

  # AWS hosting (S3 + CloudFront). Stack: thingy-web (infra/).
  deploy-aws:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: "web/.node-version"
          cache: "npm"
          cache-dependency-path: infra/package-lock.json

      - uses: actions/download-artifact@v7
        with:
          name: web-site
          path: web/_site

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.THINGY_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - run: npm --prefix infra ci

      - run: npm --prefix infra test

      - name: Deploy stack
        env:
          THINGY_CFN_ROLE_ARN: ${{ vars.THINGY_CFN_ROLE_ARN }}
          THINGY_WEB_CERTIFICATE_ARN: ${{ vars.THINGY_WEB_CERTIFICATE_ARN }}
        run: node infra/scripts/deploy-stack.mjs

      - name: Deploy web build
        run: node infra/scripts/deploy-web.mjs
